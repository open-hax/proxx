name: main-pr-gate

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read
  checks: read

jobs:
  main-lint:
    name: main-lint
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: sudo apt-get update && sudo apt-get install -y shellcheck
      - run: go install github.com/rhysd/actionlint/cmd/actionlint@latest
      - run: chmod +x scripts/*.sh
      - run: ./scripts/ci-lint.sh
      - run: /home/runner/go/bin/actionlint
      - name: eslint complexity check
        run: pnpm run lint:errors

  main-typecheck:
    name: main-typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run typecheck

  main-unit-tests:
    name: main-unit-tests
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: actions/cache@v4
        with:
          path: |
            .shadow-cljs
            ~/.m2/repository
          key: shadow-cljs-${{ runner.os }}-${{ hashFiles('shadow-cljs.edn') }}
          restore-keys: shadow-cljs-${{ runner.os }}-
      - run: pnpm install --frozen-lockfile
      - run: pnpm test

  main-coverage:
    name: main-coverage
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: actions/cache@v4
        with:
          path: |
            .shadow-cljs
            ~/.m2/repository
          key: shadow-cljs-${{ runner.os }}-${{ hashFiles('shadow-cljs.edn') }}
          restore-keys: shadow-cljs-${{ runner.os }}-
      - run: pnpm install --frozen-lockfile
      - name: Run tests with coverage
        run: pnpm run test:coverage
      - name: Enforce coverage threshold (80% statements on lib/)
        run: |
          TOTAL=$(node -e "
            const s = require('./coverage/coverage-summary.json').total;
            process.stdout.write(String(s.lines.pct));
          ")
          THRESHOLD=80
          if awk "BEGIN { exit !($TOTAL >= $THRESHOLD) }"; then
            echo "✅ Coverage ${TOTAL}% meets threshold ${THRESHOLD}%"
          else
            echo "❌ Coverage ${TOTAL}% is below threshold ${THRESHOLD}%"
            exit 1
          fi
      - name: Upload coverage artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: main-coverage-report
          path: coverage/
          retention-days: 14

  main-build:
    name: main-build
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: actions/cache@v4
        with:
          path: |
            .shadow-cljs
            ~/.m2/repository
          key: shadow-cljs-${{ runner.os }}-${{ hashFiles('shadow-cljs.edn') }}
          restore-keys: shadow-cljs-${{ runner.os }}-
      - run: pnpm install --frozen-lockfile
      - run: pnpm run build

  main-web-build:
    name: main-web-build
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run web:build

  staging-promotion-gate:
    name: staging-promotion-gate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - run: git fetch origin staging --depth=1
      - run: git merge-base --is-ancestor "${PR_HEAD_SHA}" origin/staging
        env:
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      - uses: actions/github-script@v8
        with:
          script: |
            // The retired VPS lane supplied deploy-staging and
            // staging-live-e2e. Promotion now requires the application-owned
            // staging validation that still exists; Services owns deployment
            // and live production verification.
            const requiredChecks = ["staging-preflight"];
            const { owner, repo } = context.repo;
            const ref = context.payload.pull_request.head.sha;
            const checks = await github.rest.checks.listForRef({ owner, repo, ref, per_page: 100 });
            // Reusable-workflow jobs surface as "<job> / <child job>", so match prefixes too.
            const satisfied = (name) => checks.data.check_runs.some((run) =>
              (run.name === name || run.name.startsWith(`${name} / `)) && run.conclusion === 'success');
            const missing = requiredChecks.filter((name) => !satisfied(name));
            if (missing.length > 0) {
              core.setFailed(`Missing successful staging checks for ${ref}: ${missing.join(', ')}`);
            }
