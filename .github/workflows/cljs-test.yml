name: cljs-test

on:
  pull_request:
    branches:
      - main
      - staging
    paths:
      - 'src/proxx/**'
      - 'test/proxx/**'
      - 'shadow-cljs.edn'
      - '.github/workflows/cljs-test.yml'
  push:
    branches:
      - main
    paths:
      - 'src/proxx/**'
      - 'test/proxx/**'
      - 'shadow-cljs.edn'

permissions:
  contents: read
  checks: write

jobs:
  cljs-unit-tests:
    name: cljs-unit-tests
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: actions/cache@v4
        with:
          path: |
            .shadow-cljs
            ~/.m2/repository
          key: shadow-cljs-${{ runner.os }}-${{ hashFiles('shadow-cljs.edn') }}
          restore-keys: shadow-cljs-${{ runner.os }}-

      # The ported suite boots the real application, so it needs the project's
      # dependencies (fastify, swagger, ...) and the locked shadow-cljs.
      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Compile and run CLJS tests
        run: NODE_OPTIONS=--max-old-space-size=4096 pnpm test:cljs

  cljs-lint:
    name: cljs-lint
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - uses: actions/cache@v4
        with:
          path: .clj-kondo/.cache
          key: clj-kondo-${{ runner.os }}-${{ hashFiles('shadow-cljs.edn') }}
          restore-keys: clj-kondo-${{ runner.os }}-

      - name: Install clj-kondo
        run: npm install -g clj-kondo

      - name: clj-kondo lint
        run: clj-kondo --lint src/proxx test/proxx
