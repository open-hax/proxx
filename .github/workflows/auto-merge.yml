name: Auto Merge

on:
  pull_request:
    types: [opened, ready_for_review]
  check_suite:
    types: [completed]

permissions:
  contents: write
  pull-requests: write

jobs:
  auto-merge:
    # Canonical operator gate owns qualified exact-head MERGE; eager auto-merge stays off.
    if: ${{ !always() }}
    uses: open-hax/eta-mu/.github/workflows/auto-merge.yml@main
    with:
      pr: ${{ github.event.pull_request.number }}
      merge-method: SQUASH
    secrets: inherit
