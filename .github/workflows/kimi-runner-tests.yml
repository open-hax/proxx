name: Kimi runner contract tests
on:
  pull_request:
    paths: ['.github/scripts/kimi-review.cjs', '.github/scripts/kimi-review.test.cjs', '.github/workflows/kimi-runner-tests.yml']
  push:
    branches: [main, staging]
    paths: ['.github/scripts/kimi-review.cjs', '.github/scripts/kimi-review.test.cjs', '.github/workflows/kimi-runner-tests.yml']
permissions:
  contents: read
jobs:
  test:
    name: Kimi structured runner regression tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - run: node --test .github/scripts/kimi-review.test.cjs
