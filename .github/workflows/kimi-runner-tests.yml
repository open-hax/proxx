name: Kimi runner contract tests
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths: ['.github/scripts/kimi-review.cjs', '.github/scripts/kimi-review.test.cjs', '.github/scripts/kimi-review.failure-diagnostics.test.cjs', '.github/scripts/fixtures/**', '.github/scripts/kimi-api-canary.cjs', '.github/scripts/kimi-api-canary.test.cjs', '.github/scripts/opencode-app-auth.cjs', '.github/scripts/opencode-app-auth.test.cjs', '.github/workflows/kimi-runner-tests.yml', '.clj-kondo/config.edn', 'src/proxx/policy/catalog_watch.cljs', 'src/proxx/policy/evidence.cljs', 'src/proxx/policy/model_availability.cljc', 'test/proxx/policy/model_availability_test.cljc', 'scripts/watch_model_catalogs.cljs', 'scripts/tests/catalog_watch.cljs', 'resources/model-catalog-watch.example.edn', '.github/scripts/kimi-publication-authority.cjs', '.github/scripts/kimi-publication-config.cjs', '.github/scripts/kimi-publisher.cjs', '.github/scripts/kimi-publisher.test.cjs', '.github/scripts/kimi_publisher_bridge.cljs', '.github/scripts/kimi_publisher_law.cljc', '.github/scripts/proxx-kimi-app-auth.cjs', '.github/scripts/proxx-kimi-app-auth.test.cjs', '.github/assessment-tools/package.json', '.github/assessment-tools/package-lock.json', '.github/workflows/opencode-code-review.yml', '.github/workflows/opencode-kimi-publish.yml', 'docs/verification/kimi-owned-publisher-preparation.md']
  push:
    branches: [main, staging]
    paths: ['.github/scripts/kimi-review.cjs', '.github/scripts/kimi-review.test.cjs', '.github/scripts/kimi-review.failure-diagnostics.test.cjs', '.github/scripts/fixtures/**', '.github/scripts/kimi-api-canary.cjs', '.github/scripts/kimi-api-canary.test.cjs', '.github/scripts/opencode-app-auth.cjs', '.github/scripts/opencode-app-auth.test.cjs', '.github/workflows/kimi-runner-tests.yml', '.clj-kondo/config.edn', 'src/proxx/policy/catalog_watch.cljs', 'src/proxx/policy/evidence.cljs', 'src/proxx/policy/model_availability.cljc', 'test/proxx/policy/model_availability_test.cljc', 'scripts/watch_model_catalogs.cljs', 'scripts/tests/catalog_watch.cljs', 'resources/model-catalog-watch.example.edn', '.github/scripts/kimi-publication-authority.cjs', '.github/scripts/kimi-publication-config.cjs', '.github/scripts/kimi-publisher.cjs', '.github/scripts/kimi-publisher.test.cjs', '.github/scripts/kimi_publisher_bridge.cljs', '.github/scripts/kimi_publisher_law.cljc', '.github/scripts/proxx-kimi-app-auth.cjs', '.github/scripts/proxx-kimi-app-auth.test.cjs', '.github/assessment-tools/package.json', '.github/assessment-tools/package-lock.json', '.github/workflows/opencode-code-review.yml', '.github/workflows/opencode-kimi-publish.yml', 'docs/verification/kimi-owned-publisher-preparation.md']
permissions:
  contents: read
jobs:
  test:
    name: Kimi structured runner regression tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Load locked law interpreter for owned publisher contracts
        run: npm ci --prefix .github/assessment-tools --ignore-scripts --no-audit --no-fund
      - run: node --test .github/scripts/kimi-review.test.cjs .github/scripts/kimi-api-canary.test.cjs .github/scripts/opencode-app-auth.test.cjs .github/scripts/kimi-publisher.test.cjs .github/scripts/proxx-kimi-app-auth.test.cjs .github/scripts/kimi-review.failure-diagnostics.test.cjs

  catalog-watch:
    name: Model catalog watcher contract tests
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Verify pure catalog decisions and actual local watcher transport
        run: |
          npm exec --yes --package=nbb@1.3.204 -- nbb -cp src:test -e '(require (quote [cljs.test :as t]) (quote proxx.policy.model-availability-test)) (defmethod t/report [:cljs.test/default :end-run-tests] [m] (set! (.-exitCode js/process) (if (t/successful? m) 0 1))) (t/run-tests (quote proxx.policy.model-availability-test))'
          npm exec --yes --package=nbb@1.3.204 -- nbb -cp src scripts/tests/catalog_watch.cljs

  native-api-canary:
    name: Native review API diagnostic
    needs: test
    if: ${{ github.event_name == 'pull_request' && github.event.pull_request.draft == false && github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: write
    concurrency:
      group: kimi-api-canary-${{ github.repository }}-${{ github.event.pull_request.number }}-${{ github.event.pull_request.head.sha }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Create or verify same-bot diagnostic review
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b
        with:
          github-token: ${{ github.token }}
          script: |
            const fs = require('node:fs');
            const { probe } = require(`${process.env.GITHUB_WORKSPACE}/.github/scripts/kimi-api-canary.cjs`);
            await probe({ github, context, write: receipt => fs.writeFileSync(
              `${process.env.RUNNER_TEMP}/kimi-api-canary.json`,
              JSON.stringify({ ...receipt, runID: process.env.GITHUB_RUN_ID,
                runAttempt: process.env.GITHUB_RUN_ATTEMPT }, null, 2), { mode: 0o600 }) });
      - name: Preserve diagnostic metadata including partial creation
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: kimi-api-canary-${{ github.event.pull_request.number }}-${{ github.event.pull_request.head.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/kimi-api-canary.json
          if-no-files-found: warn
          retention-days: 14
