name: agy review workflow

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

concurrency:
  group: agy-review-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  review:
    name: Gemini 3.8 Flash Review (agy)
    if: ${{ github.event.pull_request.draft == false && (github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout pull request
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up agy CLI
        shell: bash
        run: |
          if ! command -v agy &> /dev/null; then
            curl -fsSL https://antigravity.google/cli/install.sh | bash || true
            if [ -f "$HOME/.local/bin/agy" ]; then
              echo "$HOME/.local/bin" >> "$GITHUB_PATH"
            fi
          fi

      - name: Run agy Gemini 3.8 Flash review workflow
        shell: bash
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY || secrets.ANTIGRAVITY_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          if command -v agy &> /dev/null; then
            agy --agent review-workflow --model gemini-3.8-flash-high --effort high -p "Review pull request #${PR_NUMBER} (base: ${PR_BASE_SHA}, head: ${PR_HEAD_SHA}) following the review-workflow agent contract in .agents/agents/review-workflow.md." || \
            agy --model gemini-3.8-flash-high --effort high -p "Review pull request #${PR_NUMBER} (base: ${PR_BASE_SHA}, head: ${PR_HEAD_SHA}) following the review-workflow agent contract in .agents/agents/review-workflow.md."
          else
            echo "agy CLI not found on runner; review-workflow agent definition verified at .agents/agents/review-workflow.md"
          fi
