name: eta-mu-review-gate

on:
  pull_request:
    types: [opened, reopened, synchronize, edited, ready_for_review]
  pull_request_review:
    types: [submitted, dismissed]
  pull_request_review_comment:
    types: [created]

permissions:
  contents: read
  pull-requests: read

jobs:
  coderabbit-review-gate:
    name: coderabbit-review-gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout target repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Checkout eta-mu logic
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: open-hax/eta-mu
          ref: bafe9aa6a09406cfd83010f5e06538117dc6056c
          path: .eta-mu
          persist-credentials: false

      - name: Resolve target repository
        id: target_repository
        shell: bash
        env:
          TARGET_REPOSITORY: ${{ github.repository }}
        run: |
          if [[ ! "$TARGET_REPOSITORY" =~ ^[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+$ ]]; then
            echo "::error title=Invalid repository::Expected owner/name, got '$TARGET_REPOSITORY'"
            exit 1
          fi
          echo "full_name=$TARGET_REPOSITORY" >> "$GITHUB_OUTPUT"
          echo "owner=${TARGET_REPOSITORY%%/*}" >> "$GITHUB_OUTPUT"
          echo "repository=${TARGET_REPOSITORY#*/}" >> "$GITHUB_OUTPUT"

      - name: Detect eta-mu app credentials
        id: eta_mu_app_credentials
        env:
          ETA_MU_APP_ID: ${{ secrets.ETA_MU_APP_ID }}
          ETA_MU_APP_PRIVATE_KEY: ${{ secrets.ETA_MU_APP_PRIVATE_KEY }}
        run: |
          if [[ -n "${ETA_MU_APP_ID}" && -n "${ETA_MU_APP_PRIVATE_KEY}" ]]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Create eta-mu app token
        id: eta_mu_token
        if: ${{ steps.eta_mu_app_credentials.outputs.available == 'true' }}
        continue-on-error: true
        env:
          ETA_MU_APP_ID: ${{ secrets.ETA_MU_APP_ID }}
          ETA_MU_APP_PRIVATE_KEY: ${{ secrets.ETA_MU_APP_PRIVATE_KEY }}
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ env.ETA_MU_APP_ID }}
          private-key: ${{ env.ETA_MU_APP_PRIVATE_KEY }}
          owner: ${{ steps.target_repository.outputs.owner }}
          repositories: ${{ steps.target_repository.outputs.repository }}

      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
        with:
          version: 10.14.0

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: .eta-mu/packages/legacy/github/pnpm-lock.yaml

      - name: Install eta-mu dependencies
        run: pnpm --dir .eta-mu/packages/legacy/github install --frozen-lockfile --ignore-workspace

      - name: Enforce review resolution
        env:
          GITHUB_TOKEN: ${{ steps.eta_mu_token.conclusion == 'success' && steps.eta_mu_token.outputs.token != '' && steps.eta_mu_token.outputs.token || github.token }}
          ETA_MU_REVIEW_ACTORS: ${{ vars.ETA_MU_REVIEW_ACTORS }}
        run: |
          pnpm --dir .eta-mu/packages/legacy/github dev review-gate \
            --repo "${{ steps.target_repository.outputs.full_name }}" \
            --pr "${{ github.event.pull_request.number }}" \
            --strict
