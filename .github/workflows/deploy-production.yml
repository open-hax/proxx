name: Production Release Preflight

# Application validation stays with Proxx. Production deployment is centrally
# authorized by a reviewed open-hax/services PR carrying the `deploy` label and
# runs only through the DigitalOcean stack workflow. This workflow intentionally
# contains no deployment or live-host job.

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: proxx-production-preflight
  cancel-in-progress: false

jobs:
  production-preflight:
    name: production-preflight
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: actions/cache@v4
        with:
          path: |
            .shadow-cljs
            ~/.m2/repository
          key: shadow-cljs-${{ runner.os }}-${{ hashFiles('shadow-cljs.edn') }}
          restore-keys: shadow-cljs-${{ runner.os }}-
      - run: sudo apt-get update && sudo apt-get install -y shellcheck
      - run: go install github.com/rhysd/actionlint/cmd/actionlint@latest
      - run: chmod +x scripts/*.sh
      - run: ./scripts/ci-lint.sh
      - run: /home/runner/go/bin/actionlint
      - run: pnpm install --frozen-lockfile
      - run: pnpm run typecheck
      - run: pnpm test
      - run: pnpm run build
      - run: pnpm run web:build
