name: deploy-production

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: proxx-production
  cancel-in-progress: false

jobs:
  production-preflight:
    name: production-preflight
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: actions/cache@v4
        with:
          path: |
            .shadow-cljs
            ~/.m2/repository
          key: shadow-cljs-${{ runner.os }}-${{ hashFiles('shadow-cljs.edn') }}
          restore-keys: shadow-cljs-${{ runner.os }}-
      - run: sudo apt-get update && sudo apt-get install -y shellcheck
      - run: go install github.com/rhysd/actionlint/cmd/actionlint@latest
      - run: chmod +x scripts/*.sh
      - run: ./scripts/ci-lint.sh
      - run: /home/runner/go/bin/actionlint
      - run: pnpm install --frozen-lockfile
      - run: pnpm run typecheck
      - run: pnpm test
      - run: pnpm run build
      - run: pnpm run web:build

  deploy-production:
    name: deploy-production
    needs:
      - production-preflight
    uses: open-hax/services/.github/workflows/deploy-promethean.yml@main
    with:
      environment: production
      service: proxx
      source_repository: ${{ github.repository }}
      source_ref: ${{ github.sha }}
    secrets: inherit

  verify-production:
    name: verify-production
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs:
      - deploy-production
    environment: production
    steps:
      - run: |
          curl_args=()
          if [[ -n "${PRODUCTION_RESOLVE_ADDRESS}" ]]; then
            curl_args+=(--resolve "${PRODUCTION_PUBLIC_HOST}:443:${PRODUCTION_RESOLVE_ADDRESS}")
          fi
          for attempt in $(seq 1 30); do
            echo "health-check attempt ${attempt}" >/dev/null
            if curl -fsS "${curl_args[@]}" -H "Authorization: Bearer ${PRODUCTION_AUTH_TOKEN}" "${PRODUCTION_BASE_URL}/health" >/dev/null; then
              exit 0
            fi
            sleep 10
          done
          exit 1
        env:
          PRODUCTION_BASE_URL: ${{ vars.PRODUCTION_BASE_URL || 'https://prod.proxx.ussy.promethean.rest' }}
          PRODUCTION_AUTH_TOKEN: ${{ secrets.PRODUCTION_PROXY_AUTH_TOKEN }}
          PRODUCTION_PUBLIC_HOST: ${{ vars.PRODUCTION_PUBLIC_HOST || 'prod.proxx.ussy.promethean.rest' }}
          PRODUCTION_RESOLVE_ADDRESS: ${{ vars.PRODUCTION_VERIFY_RESOLVE_ADDRESS || '' }}
      - run: |
          curl_args=()
          if [[ -n "${PRODUCTION_RESOLVE_ADDRESS}" ]]; then
            curl_args+=(--resolve "${PRODUCTION_PUBLIC_HOST}:443:${PRODUCTION_RESOLVE_ADDRESS}")
          fi
          curl -fsS "${curl_args[@]}" "${PRODUCTION_BASE_URL}" >/dev/null
        env:
          PRODUCTION_BASE_URL: ${{ vars.PRODUCTION_BASE_URL || 'https://prod.proxx.ussy.promethean.rest' }}
          PRODUCTION_PUBLIC_HOST: ${{ vars.PRODUCTION_PUBLIC_HOST || 'prod.proxx.ussy.promethean.rest' }}
          PRODUCTION_RESOLVE_ADDRESS: ${{ vars.PRODUCTION_VERIFY_RESOLVE_ADDRESS || '' }}
