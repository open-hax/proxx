name: Staging Release Preflight

# The retired VPS lane had a shared staging slot. Keep the application gate,
# but do not imply that a passing run deploys or probes a host. Production
# deployment is centralized in open-hax/services on the declared DigitalOcean
# host.

on:
  push:
    branches:
      - staging
  workflow_dispatch:

concurrency:
  group: proxx-staging-preflight
  cancel-in-progress: true

jobs:
  staging-preflight:
    name: staging-preflight
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: actions/cache@v4
        with:
          path: |
            .shadow-cljs
            ~/.m2/repository
          key: shadow-cljs-${{ runner.os }}-${{ hashFiles('shadow-cljs.edn') }}
          restore-keys: shadow-cljs-${{ runner.os }}-
      - run: sudo apt-get update && sudo apt-get install -y shellcheck
      - run: go install github.com/rhysd/actionlint/cmd/actionlint@latest
      - run: chmod +x scripts/*.sh
      - run: ./scripts/ci-lint.sh
      - run: /home/runner/go/bin/actionlint
      - run: pnpm install --frozen-lockfile
      - run: pnpm run typecheck
      - run: pnpm run build
      - run: node --test --test-concurrency=1 dist/tests/account-identity.test.js dist/tests/auto-model-selector.test.js dist/tests/config.test.js dist/tests/escape-html.test.js dist/tests/factory-config.test.js dist/tests/federation-owner-credential.test.js dist/tests/host-dashboard.test.js dist/tests/json-seeder.test.js dist/tests/key-pool.test.js dist/tests/messages-compat.test.js dist/tests/model-pricing.test.js dist/tests/openai-oauth.test.js dist/tests/policy.test.js dist/tests/prompt-affinity-store.test.js dist/tests/provider-policy.test.js dist/tests/provider-routing.test.js dist/tests/proxy-headers.test.js dist/tests/proxy-rate-limit.test.js dist/tests/proxy-settings-store.test.js dist/tests/quota-monitor.test.js dist/tests/request-auth.test.js dist/tests/request-log-store.test.js dist/tests/sql-credential-store.test.js dist/tests/sql-tenant-provider-policy-store.test.js dist/tests/sse-usage.test.js dist/tests/tenant-api-key.test.js dist/tests/tenant-provider-policy-routes.test.js dist/tests/tenant-provider-policy.test.js
      - run: pnpm run web:build
