# Generated by scripts/antigravity_rollout.clj; managed Antigravity review caller.
name: Antigravity evidence review

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, edited]

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: antigravity-review-${{ github.workflow }}-${{ github.event.pull_request.number }}-${{ (github.event.action != 'edited' || github.event.changes.base.ref.from != '') && 'review' || github.run_id }}
  cancel-in-progress: true

jobs:
  review:
    if: ${{ github.event.pull_request.draft == false && (github.event.action != 'edited' || github.event.changes.base.ref.from != '') }}
    uses: open-hax/eta-mu/.github/workflows/antigravity-code-review.yml@2f49ccc2378ef2bbe873e79fb3cd52508ebe32f2
    with:
      pr_head_sha: ${{ github.event.pull_request.head.sha }}
      pr_base_sha: ${{ github.event.pull_request.base.sha }}
      review_runtime_revision: 9955ba838ff187beced4beb26f4c271941a956ec
      model: gemini-3.8-flash-high
