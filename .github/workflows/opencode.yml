name: opencode

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]

permissions:
  id-token: write
  contents: write
  pull-requests: write
  issues: write

concurrency:
  group: opencode-${{ github.repository }}-${{ github.event.issue.number || github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  opencode:
    if: |
      (github.event.comment.body == '/oc' ||
       github.event.comment.body == '/opencode' ||
       startsWith(github.event.comment.body, '/oc ') ||
       startsWith(github.event.comment.body, '/opencode ') ||
       startsWith(github.event.comment.body, format('/oc{0}', fromJSON('"\t"'))) ||
       startsWith(github.event.comment.body, format('/opencode{0}', fromJSON('"\t"'))) ||
       startsWith(github.event.comment.body, format('/oc{0}', fromJSON('"\n"'))) ||
       startsWith(github.event.comment.body, format('/opencode{0}', fromJSON('"\n"'))) ||
       startsWith(github.event.comment.body, format('/oc{0}', fromJSON('"\r"'))) ||
       startsWith(github.event.comment.body, format('/opencode{0}', fromJSON('"\r"')))) &&
      !(github.event_name == 'issue_comment' &&
        github.event.issue.number == 445 &&
        (startsWith(github.event.comment.body, 'Actionability proposal v1 for ') ||
         startsWith(github.event.comment.body, 'Actionability assessment v1 for ') ||
         startsWith(github.event.comment.body, 'Actionability withdrawal v1 for ')))
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Run OpenCode
        uses: anomalyco/opencode/github@77fc88c8ade8e5a620ebbe1197f3a572d29ae91a
        env:
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
          GITHUB_TOKEN: ${{ github.token }}
        with:
          model: opencode/big-pickle
          use_github_token: true
          share: false
