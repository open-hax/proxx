name: opencode

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]

permissions:
  id-token: write
  contents: write
  pull-requests: write
  issues: write

concurrency:
  group: opencode-${{ github.repository }}-${{ github.event.comment.id }}
  cancel-in-progress: true

jobs:
  opencode:
    if: |
      github.event.comment.user.type != 'Bot' &&
      (github.event.comment.body == '/oc' ||
       startsWith(github.event.comment.body, '/oc ') ||
       startsWith(github.event.comment.body, fromJSON('"/oc\t"')) ||
       startsWith(github.event.comment.body, fromJSON('"/oc\n"')) ||
       startsWith(github.event.comment.body, fromJSON('"/oc\r"')) ||
       github.event.comment.body == '/opencode' ||
       startsWith(github.event.comment.body, '/opencode ') ||
       startsWith(github.event.comment.body, fromJSON('"/opencode\t"')) ||
       startsWith(github.event.comment.body, fromJSON('"/opencode\n"')) ||
       startsWith(github.event.comment.body, fromJSON('"/opencode\r"')))
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Run OpenCode
        uses: anomalyco/opencode/github@latest
        env:
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
          GITHUB_TOKEN: ${{ github.token }}
        with:
          model: opencode/big-pickle
          token: ${{ github.token }}
          share: false
